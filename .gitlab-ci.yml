stages:
  - validate
  - build
  - deploy

variables:
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  IMAGE_LATEST: "$CI_REGISTRY_IMAGE:latest"

php-lint:
  stage: validate
  image: php:8.3-cli-alpine
  script:
    - find Site -name "*.php" -print0 | xargs -0 -n1 php -l

docker-build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$IMAGE_TAG" -t "$IMAGE_LATEST" .
    - docker push "$IMAGE_TAG"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker push "$IMAGE_LATEST"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy-vps:
  stage: deploy
  image: alpine:3.20
  needs:
    - docker-build
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
  script:
    - scp docker-compose.prod.yml "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/docker-compose.prod.yml"
    - |
      ssh "$VPS_USER@$VPS_HOST" "
        set -e
        cd $VPS_DEPLOY_PATH
        echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY'
        IMAGE='$IMAGE_LATEST' docker compose -f docker-compose.prod.yml pull
        IMAGE='$IMAGE_LATEST' docker compose -f docker-compose.prod.yml up -d
        docker image prune -f
      "
