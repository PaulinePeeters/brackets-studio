server {
    listen 8080;
    server_name _;
    root /var/www/html;
    index index.php;

    client_max_body_size 8m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Fichiers cachés (.env, .git, ...) : jamais servis.
    location ~ /\. {
        deny all;
    }

    # Partials PHP et données : jamais accessibles en direct via HTTP.
    location ^~ /includes/ {
        deny all;
    }
    location ^~ /data/ {
        deny all;
    }

    # Sitemap dynamique.
    location = /sitemap.xml {
        rewrite ^ /sitemap.php last;
    }

    # URL propre /projet/<slug> -> projet.php?slug=<slug>
    location ~ ^/projet/([a-zA-Z0-9-]+)/?$ {
        rewrite ^/projet/([a-zA-Z0-9-]+)/?$ /projet.php?slug=$1 last;
    }

    # URLs propres pour les pages légales.
    location = /mentions-legales {
        rewrite ^ /mentions-legales.php last;
    }
    location = /politique-confidentialite {
        rewrite ^ /politique-confidentialite.php last;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~* \.(css|js|svg|jpg|jpeg|png|webp|woff2?|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.php;
}
